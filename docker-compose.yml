version: '3.8'

services:
  vietlott:
    build: .
    container_name: vietlott-analytics
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.example
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
