[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vietlott-analytics"
version = "0.1.0"
description = "Vietlott Lottery Analytics and Prediction Application"
authors = [
    {name = "AI Developer"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "httpx",
    "beautifulsoup4",
    "python-dotenv",
    "jinja2",
    "pydantic",
    "pydantic-settings"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]
