name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mobile Dependencies
        run: |
          cd mobile-app
          npm install

      - name: Sync Capacitor iOS
        run: |
          cd mobile-app
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd mobile-app/ios/App
          pod install

      - name: Build iOS Archive & Export IPA
        run: |
          cd mobile-app/ios/App
          xcodebuild clean -workspace App.xcworkspace -scheme App -configuration Release
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Package into unsigned .ipa payload for Sideloadly / AltStore
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r VietlottAnalytics.ipa Payload
        shell: bash

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietlottAnalytics-IPA
          path: mobile-app/ios/App/build/VietlottAnalytics.ipa
