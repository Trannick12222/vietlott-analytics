<div>
    <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        Latest Draws
    </h2>
    <div class="overflow-x-auto">
        <table class="min-w-full text-sm text-left">
            <thead class="text-xs text-gray-400 uppercase bg-slate border-b border-light-slate">
                <tr>
                    <th scope="col" class="px-3 py-3">Draw #</th>
                    <th scope="col" class="px-3 py-3">Date</th>
                    <th scope="col" class="px-3 py-3">Numbers</th>
                </tr>
            </thead>
            <tbody>
                {% for draw in draws %}
                <tr class="border-b border-light-slate hover:bg-light-slate/50 transition-colors">
                    <td class="px-3 py-3 font-medium text-white">#{{ draw.draw_id }}</td>
                    <td class="px-3 py-3 text-gray-400 whitespace-nowrap">{{ draw.date }}</td>
                    <td class="px-3 py-3">
                        <div class="flex flex-wrap gap-1.5">
                            {% for num in draw.numbers %}
                            <span class="ball number-{{ num }} w-7 h-7 flex items-center justify-center rounded-full text-xs font-bold text-white shadow-sm border border-white/20">{{ num }}</span>
                            {% endblock %}
                            {% endfor %}
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="px-3 py-8 text-center text-gray-500">No draw data available</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
